<!DOCTYPE html>
<html>
    <head>
        <title>Emotional Bible Verses</title>
        <link rel ='stylesheet' href='Project_Style_Sheet.css'>
        <script>
            async function getVerse() {
                const emotionSelect = document.getElementById('emotion');
                const selectedEmotion = emotionSelect.value;

                try {
                    const response = await fetch('verses_table_Project.json');
                    const data = await response.json();

                    const verses = data[selectedEmotion];

                    if (!verses || verses.length === 0) {
                        document.getElementById("verseDisplay").innerText = "No verses found for this emotion.";
                        return;
                    }

                    const randomIndex = Math.floor(Math.random() * verses.length);
                    const selectedVerse = verses[randomIndex];

                // Display the verse and reference
                    document.getElementById("verseDisplay").innerText =
                        `"${selectedVerse.text}"\n— ${selectedVerse.ref}`;
                } catch (error) {
                    console.error("Error loading verses:", error);
                    document.getElementById("verseDisplay").innerText = "Could not load verses. Please try again.";
                }
            }

        </script>
    </head>
    <body>
        <div>
            <h1>ByMySide</h1>

            <table class="center", width="100%">
                <tr>
                    <td>
                        <button onclick="document.location='description.html'">Description</button>
                    </td>
                    <td>
                        <button onclick="document.location='contactpage.html'">Contacts</button>
                    </td>
                    <td>
                        <button onclick="document.location='source.html'">Source</button>
                    </td>
                </tr>
            </table>
            
            <select id="emotion" name="emotion">
            <option value="">-- How are you feeling? --</option>
                <optgroup label="Positive">
                    <option value="happy">Happy</option>
                    <option value="excited">Excited</option>
                    <option value="calm">Calm</option>
                    <option value="relaxed">Relaxed</option>
                </optgroup>
                <optgroup label="Negative">
                    <option value="sad">Sad</option>
                    <option value="angry">Angry</option>
                    <option value="anxious">Anxious</option>
                    <option value="fear">Fear</option>
                </optgroup>
            </select><br><br>

            <button onclick='getVerse();'>Generate Verse</button>
            <output1>
                <p id="verseDisplay"></p>
            </output1><br><br><br><br><br><br><br>
            <p>Description</p>
          </div>
    </body>
</html>
